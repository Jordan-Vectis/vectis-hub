# Builds the Vectis Scanner Android app (scanner-app/) — three APKs, one per Hub:
#   production → https://vectis-production.up.railway.app
#   staging    → https://vectis-staging.up.railway.app
#   sandbox    → https://vectis-hub-sandbox.up.railway.app
# They install side by side. The Hub's /scan screen itself ships with the Hub, not with this
# build; the app only needs rebuilding when scanner-app/ changes.
#
# Signing: the four SCANNER_* repository secrets (made once by scanner-app/scripts/make-signing-key.mjs).
# Without them it still builds, signed with a throwaway key, and says so at the top of the run.

name: Scanner app

on:
  push:
    branches: [staging, main]
    paths:
      - "scanner-app/**"
      - ".github/workflows/scanner-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: scanner-app

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Capacitor 7's Android code is compiled for Java 21.
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scanner-app/package-lock.json

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36"
          log-accepted-android-sdk-licenses: false

      - name: Install the app's tools
        run: npm ci

      - name: Check capacitor.config.ts
        run: npx tsc -p tsconfig.json

      - name: Name this build
        id: names
        run: |
          echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SCANNER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SCANNER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SCANNER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SCANNER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing SCANNER_KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing SCANNER_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing SCANNER_KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ] || missing="$missing SCANNER_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning title=Not signed with the Vectis key::Missing secret(s):$missing. These APKs are signed with a throwaway key — fine to try, but they will NOT install over each other or over a properly signed app. Run scanner-app/scripts/make-signing-key.mjs (see scanner-app/README.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/vectis-scanner.p12"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$keystore"
          # Make sure the key opens with the passwords given before building with it.
          if ! keytool -list -keystore "$keystore" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error title=Signing key doesn't open::SCANNER_KEYSTORE_BASE64, SCANNER_KEYSTORE_PASSWORD and SCANNER_KEY_ALIAS don't fit together (wrong password or alias, or the base64 was cut short). Nothing was built, so a wrongly signed app can't go out. Put the values from the KEEP THIS SAFE file back in the repository secrets."
            exit 1
          fi
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the three APKs
        env:
          SCANNER_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          SCANNER_KEYSTORE_PASSWORD: ${{ secrets.SCANNER_KEYSTORE_PASSWORD }}
          SCANNER_KEY_ALIAS: ${{ secrets.SCANNER_KEY_ALIAS }}
          SCANNER_KEY_PASSWORD: ${{ secrets.SCANNER_KEY_PASSWORD }}
          STAMP: ${{ steps.names.outputs.stamp }}
          SHORT_SHA: ${{ steps.names.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out"
          for flavor in production staging sandbox; do
            url="$(node -p "require('./hubs.json')['$flavor'].url")"
            echo "::group::$flavor — opens $url"

            # Point the app at this build's Hub (also rebuilds the offline page for it).
            HUB_URL="$url" npx cap sync android

            # Belt and braces (the Gradle build checks this too): the app must open its own Hub.
            node -e '
              const fs = require("fs");
              const want = new URL(process.argv[1]).origin;
              const cfg = JSON.parse(fs.readFileSync("android/app/src/main/assets/capacitor.config.json", "utf8"));
              if (cfg.server.url !== want) { console.error(`capacitor.config.json opens ${cfg.server.url}, not ${want}`); process.exit(1); }
              const offline = fs.readFileSync("android/app/src/main/assets/public/offline.html", "utf8");
              if (!offline.includes(JSON.stringify(want))) { console.error(`the offline page was not built for ${want}`); process.exit(1); }
            ' "$url"

            (cd android && ./gradlew --stacktrace "assemble${flavor^}Release")

            apk="$(find "android/app/build/outputs/apk/$flavor/release" -maxdepth 1 -name '*.apk' | head -n 1)"
            if [ -z "$apk" ]; then
              echo "::error::No APK came out of the $flavor build."
              exit 1
            fi
            cp "$apk" "$out/vectis-scanner-$flavor-$STAMP-$SHORT_SHA.apk"
            echo "::endgroup::"
          done
          ls -l "$out"

      - name: Upload — production
        id: up_production
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/apks/vectis-scanner-production-${{ steps.names.outputs.stamp }}-${{ steps.names.outputs.sha }}.apk
          archive: false
          # A re-run of this run uploads the same names again: replace them rather than fail.
          overwrite: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload — staging
        id: up_staging
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/apks/vectis-scanner-staging-${{ steps.names.outputs.stamp }}-${{ steps.names.outputs.sha }}.apk
          archive: false
          # A re-run of this run uploads the same names again: replace them rather than fail.
          overwrite: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload — sandbox
        id: up_sandbox
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/apks/vectis-scanner-sandbox-${{ steps.names.outputs.stamp }}-${{ steps.names.outputs.sha }}.apk
          archive: false
          # A re-run of this run uploads the same names again: replace them rather than fail.
          overwrite: true
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          MISSING: ${{ steps.signing.outputs.missing }}
          STAMP: ${{ steps.names.outputs.stamp }}
          SHORT_SHA: ${{ steps.names.outputs.sha }}
          URL_PRODUCTION: ${{ steps.up_production.outputs.artifact-url }}
          URL_STAGING: ${{ steps.up_staging.outputs.artifact-url }}
          URL_SANDBOX: ${{ steps.up_sandbox.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # ⚠ No apostrophes inside a ${var:-word} here: in double quotes bash reads one as an opening
        # single quote and the whole step fails to parse (every run then ends red, summary unwritten).
        # Check each run block with `bash -n` before pushing.
        run: |
          link() { if [ -n "$2" ]; then echo "[$1]($2)"; else echo "$1 (not built)"; fi; }
          missing="${MISSING:-}"
          if [ -z "$missing" ]; then
            missing=" none listed (the signing step did not run; see its log)"
          fi
          {
            echo "## Vectis Scanner — version 1.0.${GITHUB_RUN_NUMBER} (${SHORT_SHA:-?}, ${STAMP:-?})"
            echo
            if [ "${SIGNED:-}" = "true" ]; then
              echo "Signed with the Vectis signing key, so each APK installs over the one before it."
            elif [ "${SIGNING_OUTCOME:-}" = "failure" ]; then
              echo "> [!CAUTION]"
              echo "> **Nothing was built: the signing key in the repository secrets did not open.**"
              echo "> SCANNER_KEYSTORE_BASE64, SCANNER_KEYSTORE_PASSWORD and SCANNER_KEY_ALIAS do not fit together"
              echo "> (a wrong password or alias, or the base64 was cut short), so no wrongly signed app went out."
              echo "> Put the values from the KEEP THIS SAFE file back in the secrets, then run this workflow again."
            else
              echo "> [!WARNING]"
              echo "> **These APKs are NOT signed with the Vectis key.** Missing secret(s):$missing."
              echo "> They're signed with a throwaway key made for this run only, so they will **not** install over"
              echo "> an earlier build, or over a properly signed app (Android says \"App not installed\")."
              echo "> Fine for trying the app out. To fix it, run \`node scripts/make-signing-key.mjs\` in"
              echo "> scanner-app once (see scanner-app/README.md), then run this workflow again."
            fi
            echo
            echo "| App | Opens | Download |"
            echo "|---|---|---|"
            echo "| Vectis Scanner | https://vectis-production.up.railway.app/scan | $(link "vectis-scanner-production-$STAMP-$SHORT_SHA.apk" "$URL_PRODUCTION") |"
            echo "| Vectis Scanner (Staging) | https://vectis-staging.up.railway.app/scan | $(link "vectis-scanner-staging-$STAMP-$SHORT_SHA.apk" "$URL_STAGING") |"
            echo "| Vectis Scanner (Sandbox) | https://vectis-hub-sandbox.up.railway.app/scan | $(link "vectis-scanner-sandbox-$STAMP-$SHORT_SHA.apk" "$URL_SANDBOX") |"
            echo
            echo "### Installing on a Newland scanner"
            echo "1. Download the APK above (signed in to GitHub) — on a PC, then copy it to the scanner over USB;"
            echo "   or open this page on the scanner itself: $RUN_URL"
            echo "2. On the scanner, open the APK from Files (or the browser's downloads). The first time,"
            echo "   Android asks to allow **Install unknown apps** for that app — allow it, go back, and press **Install**."
            echo "3. Open **Vectis Scanner** and sign in with your Hub login."
            echo "4. **Updating:** install the new APK over the old one — no need to uninstall (that would throw away scans"
            echo "   still waiting to send)."
            echo
            echo "Full guide: \`scanner-app/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
